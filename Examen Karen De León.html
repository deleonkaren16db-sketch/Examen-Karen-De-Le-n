<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Minimalista</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6 font-sans">

  <header class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
    <h1 class="text-2xl font-bold tracking-wider uppercase text-sky-400">Galería</h1>
    <!-- Filtros de categoría -->
    <div id="filters" class="flex gap-2 bg-gray-900 p-1.5 rounded-xl border border-gray-800">
      <button onclick="filter('Todas')" class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-500 text-white transition">Todas</button>
      <button onclick="filter('Naturaleza')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition">Naturaleza</button>
      <button onclick="filter('Arquitectura')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition">Arquitectura</button>
      <button onclick="filter('Arte')" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white transition">Arte</button>
    </div>
  </header>

  <main id="gallery" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <!-- Las tarjetas se generan dinámicamente -->
  </main>

  <div id="modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50 backdrop-blur-sm" onclick="closeModal()">
    <div class="relative max-w-4xl max-h-[90vh]" onclick="event.stopPropagation()">
      <img id="modal-img" src="" class="max-h-[85vh] max-w-full rounded-lg object-contain shadow-2xl">
      <button onclick="closeModal()" class="absolute -top-10 right-0 text-white text-2xl font-bold hover:text-sky-400">&times;</button>
    </div>
  </div>

  <script>
    // Datos compactos de las imágenes
    const photos = [
      { cat: 'Naturaleza', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&q=80', title: 'Lago Alpino' },
      { cat: 'Arquitectura', url: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&q=80', title: 'Rascacielos' },
      { cat: 'Arte', url: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800&q=80', title: 'Neón Abstracto' },
      { cat: 'Naturaleza', url: 'https://images.unsplash.com/photo-1448375240586-882707db888b?w=800&q=80', title: 'Bosque en Niebla' },
      { cat: 'Arquitectura', url: 'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800&q=80', title: 'Geometría' },
      { cat: 'Arte', url: 'https://images.unsplash.com/photo-1561214115-f2f134cc4912?w=800&q=80', title: 'Escultura' }
    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    function render(data) {
      gallery.innerHTML = data.map(p => `
        <div onclick="openModal('${p.url}')" class="group relative h-64 rounded-xl overflow-hidden bg-gray-900 cursor-pointer border border-gray-800">
          <img src="${p.url}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent opacity-0 group-hover:opacity-100 transition p-4 flex flex-col justify-end">
            <span class="text-xs text-sky-400 font-semibold uppercase">${p.cat}</span>
            <h3 class="text-sm font-bold text-white">${p.title}</h3>
          </div>
        </div>
      `).join('');
    }

    function filter(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const isActive = btn.textContent === cat;
        btn.className = `filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
          isActive ? 'bg-sky-500 text-white' : 'text-gray-400 hover:text-white'
        }`;
      });
      render(cat === 'Todas' ? photos : photos.filter(p => p.cat === cat));
    }

    function openModal(url) {
      modalImg.src = url;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Render inicial
    render(photos);
  </script>
</body>
</html>
